<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Environment Detection - Mobile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0a0e1a;
            color: #e0e6f0;
            padding: 16px;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #8892b0;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .btn-primary {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            transition: all 0.3s ease;
            margin-bottom: 16px;
            touch-action: manipulation;
        }

        .btn-primary:active {
            transform: scale(0.97);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-success {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            transition: all 0.3s ease;
            margin-top: 12px;
            touch-action: manipulation;
        }

        .btn-success:active {
            transform: scale(0.97);
        }

        .btn-success:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-danger {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            transition: all 0.3s ease;
            margin-top: 12px;
            touch-action: manipulation;
        }

        .status {
            text-align: center;
            color: #8892b0;
            font-size: 14px;
            padding: 12px;
            background: rgba(31, 41, 55, 0.5);
            border-radius: 8px;
            margin-bottom: 16px;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .status.loading {
            color: #60a5fa;
        }

        .status.success {
            color: #34d399;
        }

        .status.error {
            color: #f87171;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .card {
            background: #111827;
            border-radius: 12px;
            padding: 16px;
            border: 1px solid #1f2937;
        }

        .card-title {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 10px;
            color: #9ca3af;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .metric {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 12px;
            border-bottom: 1px solid rgba(31, 41, 55, 0.3);
        }

        .metric:last-child {
            border-bottom: none;
        }

        .metric-label {
            color: #6b7280;
        }

        .metric-value {
            font-family: 'Courier New', monospace;
            font-weight: 600;
            font-size: 12px;
            color: #e5e7eb;
        }

        .metric-value.high {
            color: #f87171;
        }

        .metric-value.medium {
            color: #fbbf24;
        }

        .metric-value.low {
            color: #34d399;
        }

        .result-card {
            background: #111827;
            border-radius: 12px;
            padding: 20px;
            border: 2px solid #1f2937;
            margin-top: 16px;
            display: none;
        }

        .result-card.visible {
            display: block;
        }

        .verdict {
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
        }

        .verdict.ec2 {
            color: #f87171;
        }

        .verdict.mobile {
            color: #60a5fa;
        }

        .verdict.local {
            color: #34d399;
        }

        .verdict.unknown {
            color: #fbbf24;
        }

        .confidence-bar {
            height: 8px;
            background: #1f2937;
            border-radius: 4px;
            margin: 10px 0;
            overflow: hidden;
        }

        .confidence-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.8s ease;
            border-radius: 4px;
        }

        .confidence-text {
            text-align: center;
            color: #9ca3af;
            font-size: 14px;
        }

        .json-container {
            background: #0a0e1a;
            border-radius: 8px;
            padding: 12px;
            margin-top: 12px;
            border: 1px solid #1f2937;
            max-height: 300px;
            overflow-y: auto;
        }

        .json-container pre {
            font-family: 'Courier New', monospace;
            font-size: 11px;
            color: #e5e7eb;
            white-space: pre-wrap;
            word-wrap: break-word;
            margin: 0;
        }

        .score-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin: 12px 0;
        }

        .score-item {
            text-align: center;
            padding: 8px;
            background: rgba(31, 41, 55, 0.5);
            border-radius: 8px;
        }

        .score-item .label {
            font-size: 10px;
            color: #6b7280;
            display: block;
        }

        .score-item .value {
            font-size: 18px;
            font-weight: 700;
            display: block;
        }

        .score-item .value.ec2-score {
            color: #f87171;
        }
        .score-item .value.mobile-score {
            color: #60a5fa;
        }
        .score-item .value.local-score {
            color: #34d399;
        }

        .copy-toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #10b981;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            opacity: 0;
            transition: all 0.4s ease;
            pointer-events: none;
            z-index: 1000;
        }

        .copy-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 480px) {
            .grid {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            .card {
                padding: 12px;
            }
            .verdict {
                font-size: 22px;
            }
            h1 {
                font-size: 20px;
            }
        }

        @media (max-width: 380px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔬 Environment Detection</h1>
        <p class="subtitle">Tap the button to detect your environment</p>

        <button class="btn-primary" id="runBtn" onclick="runAll()">
            🚀 Run Detection
        </button>

        <div class="status" id="status">Ready to detect</div>

        <div class="grid" id="grid">
            <div class="card">
                <div class="card-title">🔄 Event Loop</div>
                <div id="elMetrics"></div>
            </div>
            <div class="card">
                <div class="card-title">🗑️ GC</div>
                <div id="gcMetrics"></div>
            </div>
            <div class="card">
                <div class="card-title">🌐 Network</div>
                <div id="netMetrics"></div>
            </div>
            <div class="card">
                <div class="card-title">⚡ CPU</div>
                <div id="cpuMetrics"></div>
            </div>
            <div class="card">
                <div class="card-title">🎮 WebGL</div>
                <div id="webglMetrics"></div>
            </div>
            <div class="card">
                <div class="card-title">🌡️ Thermal</div>
                <div id="thermalMetrics"></div>
            </div>
        </div>

        <div class="result-card" id="resultCard">
            <div class="verdict" id="verdict">—</div>

            <div class="score-grid">
                <div class="score-item">
                    <span class="label">EC2 Score</span>
                    <span class="value ec2-score" id="ec2Score">0%</span>
                </div>
                <div class="score-item">
                    <span class="label">Mobile Score</span>
                    <span class="value mobile-score" id="mobileScore">0%</span>
                </div>
                <div class="score-item">
                    <span class="label">Local Score</span>
                    <span class="value local-score" id="localScore">0%</span>
                </div>
            </div>

            <div class="confidence-bar">
                <div class="confidence-fill" id="confidenceFill" style="width: 0%"></div>
            </div>
            <div class="confidence-text">Confidence: <span id="confidenceText">0%</span></div>

            <button class="btn-success" id="copyBtn" onclick="copyJSON()">
                📋 Copy JSON to Clipboard
            </button>

            <button class="btn-danger" onclick="resetUI()">
                🔄 Reset & Run Again
            </button>

            <div class="json-container">
                <pre id="jsonOutput">Waiting for results...</pre>
            </div>
        </div>
    </div>

    <div class="copy-toast" id="copyToast">✅ Copied to clipboard!</div>

    <script>
        let currentResults = null;
        let allMetrics = {};

        // Utility functions
        function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

        function calcStdDev(arr) {
            if (arr.length === 0) return 0;
            const mean = arr.reduce((a, b) => a + b, 0) / arr.length;
            return Math.sqrt(arr.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / arr.length);
        }

        function updateMetrics(containerId, metrics) {
            const container = document.getElementById(containerId);
            if (!container) return;
            container.innerHTML = Object.entries(metrics)
                .filter(([k]) => !k.startsWith('is'))
                .map(([k, v]) =>
                    '<div class="metric"><span class="metric-label">' + k + '</span><span class="metric-value">' + v + '</span></div>'
                ).join('');
        }

        // Tests
        async function testEventLoop() {
            const times = [];
            for (let i = 0; i < 15; i++) {
                const start = performance.now();
                for (let j = 0; j < 100; j++) await Promise.resolve();
                times.push(performance.now() - start);
                await sleep(5);
            }
            const mean = times.reduce((a, b) => a + b, 0) / times.length;
            const stdDev = calcStdDev(times);
            const diffs = [];
            for (let i = 1; i < times.length; i++) diffs.push(Math.abs(times[i] - times[i - 1]));
            const sawtooth = diffs.length > 0 ? Math.max(...diffs) / (diffs.reduce((a, b) => a + b, 0) / diffs.length) : 0;
            return {
                'Mean (ms)': mean.toFixed(2),
                'StdDev (ms)': stdDev.toFixed(2),
                'Sawtooth': sawtooth.toFixed(2) + 'x',
                'isEC2': stdDev > 0.15 || sawtooth > 2.0
            };
        }

        async function testGC() {
            const start = performance.now();
            const arr = [];
            for (let i = 0; i < 50000; i++) arr.push({ data: new Array(100).fill(i) });
            arr.length = 0;
            const major = performance.now() - start;
            const minorStart = performance.now();
            for (let i = 0; i < 10000; i++) { const o = { x: i }; }
            const minor = performance.now() - minorStart;
            return {
                'Major (ms)': major.toFixed(1),
                'Minor (ms)': minor.toFixed(1),
                'isEC2': major > 35
            };
        }

        async function testNetwork() {
            const urls = ['https://www.google.com', 'https://www.cloudflare.com', 'https://www.amazon.com'];
            const all = [];
            for (const url of urls) {
                for (let i = 0; i < 2; i++) {
                    try {
                        const start = performance.now();
                        await fetch(url + '?_=' + Math.random(), { cache: 'no-store', mode: 'no-cors' });
                        all.push(performance.now() - start);
                    } catch (e) {
                        all.push(1000);
                    }
                }
            }
            const avg = all.reduce((a, b) => a + b, 0) / all.length;
            const jitter = calcStdDev(all);
            return {
                'Avg RTT (ms)': avg.toFixed(0),
                'Jitter (ms)': jitter.toFixed(1),
                'isEC2': avg < 100 && jitter < 20
            };
        }

        async function testCPU() {
            const times = [];
            for (let i = 0; i < 500; i++) {
                const start = performance.now();
                let x = 0;
                for (let j = 0; j < 2000; j++) {
                    x += Math.sqrt(j) * Math.sin(j);
                    x = x ^ (x << 13) ^ (x >> 17);
                }
                times.push(performance.now() - start);
            }
            const sorted = [...times].sort((a, b) => a - b);
            const q1 = sorted[125] || 0,
                q3 = sorted[375] || 0;
            const iqr = q3 - q1;
            const median = sorted[250] || 0;
            const outliers = times.filter(t => Math.abs(t - median) > 3 * iqr);
            return {
                'Outliers %': ((outliers.length / times.length) * 100).toFixed(2),
                'IQR (ms)': iqr.toFixed(2),
                'isEC2': outliers.length / times.length > 0.005
            };
        }

        async function testWebGL() {
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (!gl) return { 'Available': 'No', 'isEC2': false };

                const vs = gl.createShader(gl.VERTEX_SHADER);
                gl.shaderSource(vs, 'attribute vec2 pos; void main() { gl_Position = vec4(pos, 0, 1); }');
                gl.compileShader(vs);

                const fs = gl.createShader(gl.FRAGMENT_SHADER);
                gl.shaderSource(fs, 'void main() { gl_FragColor = vec4(1,0,0,1); }');
                gl.compileShader(fs);

                const prog = gl.createProgram();
                gl.attachShader(prog, vs);
                gl.attachShader(prog, fs);
                gl.linkProgram(prog);
                gl.useProgram(prog);

                const start = performance.now();
                gl.clearColor(0.5, 0.5, 0.5, 1);
                gl.clear(gl.COLOR_BUFFER_BIT);
                const pixels = new Uint8Array(256 * 256 * 4);
                gl.readPixels(0, 0, 256, 256, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
                const time = performance.now() - start;

                return {
                    'ReadPixels (ms)': time.toFixed(1),
                    'Available': 'Yes',
                    'isEC2': time > 20
                };
            } catch (e) {
                return { 'Available': 'Error', 'isEC2': false };
            }
        }

        async function testThermal() {
            const times = [];
            for (let i = 0; i < 15; i++) {
                const start = performance.now();
                let x = 0;
                for (let j = 0; j < 30000; j++) {
                    x += Math.sin(j) * Math.cos(j * 0.1);
                    x = Math.pow(x % 1000, 1.1);
                }
                times.push(performance.now() - start);
                await sleep(30);
            }
            const first = times.slice(0, 7).reduce((a, b) => a + b, 0) / 7;
            const second = times.slice(7).reduce((a, b) => a + b, 0) / 8;
            const deg = (first - second) / first;

            let battery = 'Not Available';
            try {
                if (navigator.getBattery) {
                    const b = await navigator.getBattery();
                    battery = 'Available' + (b.charging ? ' (Charging)' : ' (Battery)');
                }
            } catch (e) {}

            return {
                'Degradation %': (deg * 100).toFixed(1),
                'Battery': battery,
                'isEC2': deg < 0.01
            };
        }

        async function runTests() {
            const [el, gc, net, cpu, webgl, thermal] = await Promise.all([
                testEventLoop(), testGC(), testNetwork(), testCPU(), testWebGL(), testThermal()
            ]);
            return { eventLoop: el, gc, network: net, cpu, webgl, thermal };
        }

        function displayResults(results) {
            updateMetrics('elMetrics', results.eventLoop);
            updateMetrics('gcMetrics', results.gc);
            updateMetrics('netMetrics', results.network);
            updateMetrics('cpuMetrics', results.cpu);
            updateMetrics('webglMetrics', results.webgl);
            updateMetrics('thermalMetrics', results.thermal);

            // Calculate scores
            let ec2Score = 0,
                mobileScore = 0,
                localScore = 0;

            if (results.eventLoop.isEC2) ec2Score += 25;
            if (results.gc.isEC2) ec2Score += 20;
            if (results.network.isEC2) ec2Score += 20;
            if (results.cpu.isEC2) ec2Score += 20;
            if (results.thermal.isEC2) ec2Score += 15;

            if (results.thermal.Battery.includes('Available')) mobileScore += 40;
            if (parseFloat(results.thermal['Degradation %']) > 3) mobileScore += 30;
            if (parseFloat(results.eventLoop.Sawtooth) > 2.5) mobileScore += 30;

            if (!results.eventLoop.isEC2 && !results.cpu.isEC2 && !results.network.isEC2) localScore += 30;
            if (parseFloat(results.eventLoop['StdDev (ms)']) < 0.1) localScore += 30;

            const total = ec2Score + mobileScore + localScore;
            const verdictEl = document.getElementById('verdict');

            // Store scores for display
            document.getElementById('ec2Score').textContent = Math.round((ec2Score / Math.max(total, 1)) * 100) + '%';
            document.getElementById('mobileScore').textContent = Math.round((mobileScore / Math.max(total, 1)) * 100) + '%';
            document.getElementById('localScore').textContent = Math.round((localScore / Math.max(total, 1)) * 100) + '%';

            const confidence = Math.max(ec2Score, mobileScore, localScore);

            if (ec2Score > mobileScore && ec2Score > localScore) {
                verdictEl.textContent = '🖥️ EC2 (Cloud)';
                verdictEl.className = 'verdict ec2';
            } else if (mobileScore > ec2Score && mobileScore > localScore) {
                verdictEl.textContent = '📱 Mobile Device';
                verdictEl.className = 'verdict mobile';
            } else if (localScore > ec2Score && localScore > mobileScore) {
                verdictEl.textContent = '💻 Local Machine';
                verdictEl.className = 'verdict local';
            } else {
                verdictEl.textContent = '⚠️ Mixed / Inconclusive';
                verdictEl.className = 'verdict unknown';
            }

            const confidencePercent = (confidence / Math.max(total, 1) * 100);
            document.getElementById('confidenceText').textContent = confidencePercent.toFixed(1) + '%';
            document.getElementById('confidenceFill').style.width = confidencePercent + '%';

            // Build JSON
            const jsonData = {
                timestamp: new Date().toISOString(),
                verdict: verdictEl.textContent,
                confidence: confidencePercent.toFixed(1) + '%',
                scores: {
                    ec2: Math.round((ec2Score / Math.max(total, 1)) * 100) + '%',
                    mobile: Math.round((mobileScore / Math.max(total, 1)) * 100) + '%',
                    local: Math.round((localScore / Math.max(total, 1)) * 100) + '%'
                },
                metrics: {
                    eventLoop: results.eventLoop,
                    gc: results.gc,
                    network: results.network,
                    cpu: results.cpu,
                    webgl: results.webgl,
                    thermal: results.thermal
                },
                environment: {
                    userAgent: navigator.userAgent,
                    platform: navigator.platform,
                    language: navigator.language,
                    hardwareConcurrency: navigator.hardwareConcurrency,
                    screenSize: screen.width + 'x' + screen.height,
                    deviceMemory: navigator.deviceMemory || 'unknown'
                }
            };

            currentResults = jsonData;
            document.getElementById('jsonOutput').textContent = JSON.stringify(jsonData, null, 2);
            document.getElementById('resultCard').classList.add('visible');
        }

        async function runAll() {
            const btn = document.getElementById('runBtn');
            const status = document.getElementById('status');

            btn.disabled = true;
            btn.textContent = '⏳ Running...';
            status.textContent = '⏳ Running detection... (this takes ~30 seconds)';
            status.className = 'status loading';

            try {
                const results = await runTests();
                displayResults(results);
                status.textContent = '✅ Detection complete! Tap "Copy JSON" below';
                status.className = 'status success';
            } catch (e) {
                status.textContent = '❌ Error: ' + e.message;
                status.className = 'status error';
                console.error(e);
            } finally {
                btn.disabled = false;
                btn.textContent = '🔄 Run Again';
            }
        }

        function copyJSON() {
            if (!currentResults) {
                alert('Please run the detection first!');
                return;
            }

            const json = JSON.stringify(currentResults, null, 2);

            // Try using the clipboard API
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(json).then(() => {
                    showToast();
                }).catch(() => {
                    // Fallback
                    fallbackCopy(json);
                });
            } else {
                // Fallback for older browsers
                fallbackCopy(json);
            }
        }

        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.left = '-9999px';
            textarea.style.top = '-9999px';
            document.body.appendChild(textarea);
            textarea.select();

            try {
                document.execCommand('copy');
                showToast();
            } catch (e) {
                alert('Could not copy. Please select the JSON below and copy manually.');
            }

            document.body.removeChild(textarea);
        }

        function showToast() {
            const toast = document.getElementById('copyToast');
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        function resetUI() {
            location.reload();
        }

        // Auto-run on load
        window.addEventListener('load', () => {
            // Auto-run after a small delay
            setTimeout(() => {
                runAll();
            }, 500);
        });
    </script>
</body>
</html>
